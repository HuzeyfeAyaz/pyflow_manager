include:
  - included_tasks.yaml
tasks:
  task1:
    command: "python tests/sample_task2.py --output output1.txt"
    inputs: []
    outputs: ["output1.txt"]
  task2:
    command: "echo 'Task 2' > output2.txt"
    inputs: task1.outputs
    outputs: ["output2.txt"]
  task4:
    command: "echo 'Task 4' > output4.txt"
    inputs: output2.txt
    outputs: ["output4.txt"]
  task5:
    command: "echo 'Task 5' > output5.txt"
    inputs: []
    outputs: ["output5.txt"]
  task6:
    command: "echo 'Task 6' > output6.txt"
    inputs: [task3.outputs, task5.outputs]
    outputs: ["output6.txt"]
  task7:
    command: "python tests/sample_task.py"
    inputs: output6.txt
    outputs: ["output7.txt"]
  task8:
    command: "echo 'Task 8' > output8.txt"
    inputs: output7.txt
    outputs: ["output8.txt"]
  sweep_task:
    command: "echo 'Sweep {a} {b}' > sweep_{a}_{b}.txt"
    inputs: []
    outputs: ["sweep_{a}_{b}.txt"]
    parameters:
      a: [1, 2]
      b: [x, y]
